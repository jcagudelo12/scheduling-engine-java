# Entorno de la prueba de carga. Lo usa bench/run.sh, que en cada repetición levanta todo desde
# cero (NATS vacío) con el motor en núcleos fijos (ENGINE_CPUS) que no comparte con nada más.
# NATS y k6 usan otros núcleos.

name: bench

services:
  nats:
    image: nats:2
    command: ["-js"]
    cpuset: ${NATS_CPUS:-2,3}

  java:
    image: sched-engine-java:dev
    build:
      context: ..
    cpuset: ${ENGINE_CPUS:-4,6}
    mem_limit: 1g
    depends_on: [nats]
    environment:
      SCHED_ROLE: all
      SCHED_NATS_URL: nats://nats:4222
      # La prueba de carga mide el motor, no la seguridad: sin token ni TLS, en una red aislada
      # y efímera (NATS tampoco lleva autenticación aquí). Nunca lo copie a un despliegue real;
      # ver deploy/docker-compose.yml para la configuración con seguridad.
      SCHED_AUTH: none
      SCHED_GRPC_TLS: disabled
      SCHED_MAX_COMBINATIONS: ${MAX_COMBINATIONS:-5}
      # Esta prueba (bench/run.sh) mide también las primeras solicitudes EN FRÍO (fila "200 (en frío)" del reporte) y no espera a
      # /ready: con el calentamiento el motor competiría consigo mismo y la fila dejaría de medir lo que dice. Por eso va apagado;
      # SCHED_WARMUP=on bench/run.sh lo activa (el motor ya no estaría frío al empezar). Ver bench/results/warmup.md.
      SCHED_WARMUP: ${SCHED_WARMUP:-off}
      LOGGING_LEVEL_ROOT: warn
      LOGGING_LEVEL_SCHED_SERVER: info
    ports:
      # Solo para cargar el catálogo y consultar /ready desde el host. La carga de k6
      # entra por la red interna de Docker, sin pasar por el proxy de puertos.
      - "18080:8080"
      - "15051:50051"
