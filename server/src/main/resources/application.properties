# Configuración por variables de entorno SCHED_*, con valores por defecto para desarrollo local.
sched.role=${SCHED_ROLE:all}
sched.nats.url=${SCHED_NATS_URL:nats://localhost:4222}
sched.nats.subject-prefix=${SCHED_NATS_SUBJECT_PREFIX:sched}
sched.nats.user=${SCHED_NATS_USER:}
sched.nats.password=${SCHED_NATS_PASSWORD:}
sched.nats.token=${SCHED_NATS_TOKEN:}
sched.nats.tls-ca=${SCHED_NATS_TLS_CA:}
sched.nats.stream=${SCHED_NATS_STREAM:SCHED_CATALOG}
sched.grpc.port=${SCHED_GRPC_PORT:50051}
sched.grpc.tls=${SCHED_GRPC_TLS:required}
sched.grpc.tls-cert=${SCHED_GRPC_TLS_CERT:}
sched.grpc.tls-key=${SCHED_GRPC_TLS_KEY:}
sched.grpc.tls-client-ca=${SCHED_GRPC_TLS_CLIENT_CA:}
sched.auth=${SCHED_AUTH:jwt}
sched.jwt.public-keys=${SCHED_JWT_PUBLIC_KEYS:}
sched.jwt.issuer=${SCHED_JWT_ISSUER:}
sched.jwt.audience=${SCHED_JWT_AUDIENCE:}
sched.jwt.clock-skew-s=${SCHED_JWT_CLOCK_SKEW_S:30}
sched.jwt.max-ttl-s=${SCHED_JWT_MAX_TTL_S:900}
sched.max-combinations=${SCHED_MAX_COMBINATIONS:200}
sched.max-alternatives=${SCHED_MAX_ALTERNATIVES:5}
sched.limits.max-courses=${SCHED_MAX_COURSES:12}
sched.limits.max-avoid=${SCHED_MAX_AVOID:42}
sched.limits.max-id-length=${SCHED_MAX_ID_LENGTH:64}
sched.limits.max-body-bytes=${SCHED_MAX_BODY_BYTES:65536}
sched.search-timeout-ms=${SCHED_SEARCH_TIMEOUT_MS:150}
sched.solver=${SCHED_SOLVER:forward-checking}

server.port=${SCHED_HTTP_PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off

# Hilos virtuales (Java 21+): cada solicitud HTTP corre en un hilo liviano.
spring.threads.virtual.enabled=true

# JSON en snake_case.
spring.jackson.property-naming-strategy=SNAKE_CASE
