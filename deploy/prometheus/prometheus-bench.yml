# Prometheus de la prueba de carga (bench/docker-compose.observe.yml, con OBSERVE=1 en bench/run-pico.sh).
# Igual que prometheus.yml, pero raspa los servicios de bench/docker-compose.pico.yml: engine1,
# engine2 y engine3 (los dos últimos solo existen con 3 réplicas) y la ingesta. Como cada réplica
# tiene nombre propio, la etiqueta "instance" es ese nombre (engine1...) y no una IP.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sched-engine
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [engine1, engine2, engine3]
        type: A
        port: 8081
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance
      - target_label: role
        replacement: query
  - job_name: sched-ingest
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [ingest]
        type: A
        port: 8081
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance
      - target_label: role
        replacement: ingest
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
