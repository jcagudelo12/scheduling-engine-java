# Despliegue local con varias instancias (ADR 0005) y seguridad activada:
#
#   deploy/setup-dev.sh                                                  # una vez: certificados, llaves, deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml up -d --scale engine=5   # más réplicas
#
# - nats:   JetStream con el historial compartido del catálogo (persistente). Con usuario y
#           contraseña, TLS y permisos mínimos (deploy/nats/nats.conf). No publica puertos:
#           solo lo alcanzan los servicios de esta red. Para depurar desde el host, agregue
#           "127.0.0.1:4222:4222" (solo en esa interfaz) y use un cliente con la CA y la contraseña.
# - ingest: única instancia que recibe datos de la institución (gRPC :50051). Exige TLS con
#           autenticación mutua: solo conecta un cliente con certificado firmado por la CA.
# - engine: instancias de consulta, escalables; no exponen puertos al host. Exigen un token
#           firmado (Authorization: Bearer) salvo en /health y /ready.
# - lb:     Traefik en :8080, reparte HTTP entre las instancias de consulta y solo envía tráfico a
#           las "healthy" (su /ready responde 200). Limita solicitudes por IP, solicitudes
#           simultáneas y tamaño del cuerpo. Sin panel ni API expuestos.
# - prometheus (opcional, perfil "observability"): raspa el puerto de administración de cada instancia
#           (:8081, /actuator/prometheus) por la red interna. Ese puerto no pasa por Traefik, no exige
#           token y no se publica al host; solo Prometheus lo alcanza. La interfaz de Prometheus queda
#           en 127.0.0.1:9090 (solo la máquina local):
#             docker compose -f deploy/docker-compose.yml --profile observability up -d
# - grafana (perfil "observability"): tableros en el navegador, en 127.0.0.1:3000 (solo la máquina
#           local). Usuario "admin" y contraseña GRAFANA_ADMIN_PASSWORD de deploy/.env (la genera
#           setup-dev.sh); sin acceso anónimo. El datasource y el tablero "Motor de horarios" se
#           aprovisionan desde deploy/grafana/: al abrir Grafana ya están.
# - cadvisor (perfil "observability"): CPU, memoria y red de cada contenedor. No publica puertos:
#           solo Prometheus lo raspa por la red interna. Lee el host en solo lectura (ver abajo).
#
# Los secretos (deploy/.env, deploy/certs/, deploy/keys/) los genera deploy/setup-dev.sh y no se
# versionan. El HTTP de los estudiantes va sin TLS en este despliegue: en producción el TLS se
# termina en el ingress de la institución (o en Traefik con su propio certificado).

name: sched-engine

x-engine: &engine
  image: sched-engine-java:dev
  environment: &engine-env
    # TLS hacia NATS: se confía solo en la CA de desarrollo.
    SCHED_NATS_URL: tls://nats:4222
    SCHED_NATS_USER: engine
    SCHED_NATS_PASSWORD: ${NATS_ENGINE_PASSWORD:?falta deploy/.env (ejecute deploy/setup-dev.sh)}
    SCHED_NATS_TLS_CA: /certs/ca.crt
  depends_on:
    - nats
  restart: unless-stopped

services:
  nats:
    image: nats:2
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_ENGINE_PASSWORD: ${NATS_ENGINE_PASSWORD:?falta deploy/.env (ejecute deploy/setup-dev.sh)}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./certs/nats:/certs:ro
      - nats-data:/data
    restart: unless-stopped

  ingest:
    <<: *engine
    # Solo este servicio construye la imagen; "engine" la reutiliza.
    build:
      context: ..
    environment:
      <<: *engine-env
      SCHED_ROLE: ingest
      SCHED_GRPC_TLS: required
      SCHED_GRPC_TLS_CERT: /certs/server.crt
      SCHED_GRPC_TLS_KEY: /certs/server.key
      # CA que firma los certificados de cliente de la institución.
      SCHED_GRPC_TLS_CLIENT_CA: /certs/ca.crt
    volumes:
      - ./certs/ingest:/certs:ro
    ports:
      - "50051:50051"

  engine:
    <<: *engine
    pull_policy: never
    environment:
      <<: *engine-env
      SCHED_ROLE: query
      SCHED_AUTH: jwt
      SCHED_JWT_PUBLIC_KEYS: /keys
      SCHED_JWT_ISSUER: ${SCHED_JWT_ISSUER:-institucion-dev}
      SCHED_JWT_AUDIENCE: ${SCHED_JWT_AUDIENCE:-sched-engine}
      SCHED_MAX_BODY_BYTES: ${MAX_BODY_BYTES:-65536}
    volumes:
      - ./certs/engine:/certs:ro
      # Solo las llaves públicas; la privada no sale de deploy/keys/private.
      - ./keys/public:/keys:ro
    deploy:
      replicas: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.engine.rule: PathPrefix(`/`)
      traefik.http.routers.engine.entrypoints: web
      traefik.http.routers.engine.middlewares: engine-inflight,engine-ratelimit,engine-bodylimit
      traefik.http.services.engine.loadbalancer.server.port: "8080"
      # Solicitudes simultáneas por IP de origen.
      traefik.http.middlewares.engine-inflight.inflightreq.amount: ${INFLIGHT_MAX:-100}
      traefik.http.middlewares.engine-inflight.inflightreq.sourcecriterion.ipstrategy.depth: "0"
      # Solicitudes por segundo por IP: promedio sostenido y ráfaga. Detrás de otro proxy,
      # ajuste ipstrategy.depth (o excludedips) para limitar por la IP real del cliente.
      traefik.http.middlewares.engine-ratelimit.ratelimit.average: ${RATE_LIMIT_AVERAGE:-50}
      traefik.http.middlewares.engine-ratelimit.ratelimit.period: 1s
      traefik.http.middlewares.engine-ratelimit.ratelimit.burst: ${RATE_LIMIT_BURST:-100}
      traefik.http.middlewares.engine-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth: "0"
      # Tamaño máximo del cuerpo: más allá, Traefik responde 413 sin llegar al motor.
      traefik.http.middlewares.engine-bodylimit.buffering.maxrequestbodybytes: ${MAX_BODY_BYTES:-65536}
      traefik.http.middlewares.engine-bodylimit.buffering.memrequestbodybytes: ${MAX_BODY_BYTES:-65536}

  lb:
    image: traefik:v3
    command:
      - --providers.docker=true
      # Solo los contenedores con traefik.enable=true (no la ingesta ni NATS).
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Lecturas lentas (slowloris): se corta la solicitud que tarda más de 10 s en llegar.
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=10s
      # Sin panel ni API de Traefik (no hay --api.insecure ni entrypoint de panel).
      - --api=false
      - --global.sendanonymoususage=false
    ports:
      - "8080:80"
    volumes:
      # El socket da acceso a la API de Docker: en producción use un proxy de solo lectura del
      # socket o el orquestador (Kubernetes) en lugar de montarlo.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Métricas del motor (solo desarrollo): ver deploy/prometheus/. Perfil opcional.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Solo en la interfaz local: sin autenticación, no debe quedar abierta a la red.
      - "127.0.0.1:9090:9090"
    depends_on:
      - engine
      - ingest
      - cadvisor
    restart: unless-stopped

  # Tableros (solo desarrollo): ver deploy/grafana/. Perfil opcional, junto a prometheus.
  # Sin volumen a propósito: todo (datasource y tablero) sale de deploy/grafana/, así que no hay
  # estado que se desfase de la contraseña de deploy/.env. Lo que se edite en la interfaz no persiste.
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [observability]
    # Se niega a arrancar sin contraseña: con la variable vacía Grafana usaría admin/admin.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "falta GRAFANA_ADMIN_PASSWORD en deploy/.env (ejecute deploy/setup-dev.sh)" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # Sin telemetría ni consultas de actualización hacia fuera.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/motor-de-horarios.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Solo en la interfaz local: no debe quedar abierta a la red.
      # GRAFANA_PORT cambia el puerto del host si el 3000 ya lo usa otro programa.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # CPU, memoria y red por contenedor (solo desarrollo). SIN puertos publicados: solo Prometheus
  # lo raspa, por la red interna. RIESGO ACEPTADO SOLO PARA DESARROLLO: para medir contenedores
  # necesita leer el host (cgroups, /var/lib/docker y el socket de Docker), todo en solo lectura.
  # No lo use así en producción; allí use el agente de métricas del orquestador.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    profiles: [observability]
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  # Institución simulada (solo para desarrollo). No arranca con "up": se usa a demanda con
  #   docker compose -f deploy/docker-compose.yml run --rm simulator load
  #   docker compose -f deploy/docker-compose.yml run --rm simulator seats 2 MAT101-01 0
  # Presenta su certificado de cliente (deploy/certs/client) a la ingesta.
  # Los escenarios de simulation/fixtures/ se montan; uno nuevo se usa sin reconstruir.
  simulator:
    image: sched-simulator-java:dev
    build:
      context: ..
      target: simulator
    profiles: [tools]
    environment:
      SCHED_INGEST_URL: ingest:50051
      SCHED_INGEST_TLS_CERT: /certs/client.crt
      SCHED_INGEST_TLS_KEY: /certs/client.key
      SCHED_INGEST_TLS_CA: /certs/ca.crt
    volumes:
      - ../simulation/fixtures:/app/simulation/fixtures:ro
      - ./certs/client:/certs:ro
    depends_on:
      - ingest

volumes:
  nats-data:
  prometheus-data:
