# NATS del despliegue de desarrollo (ADR 0005): con autenticación, TLS y permisos mínimos.
#
# El motor se conecta como "engine" con la contraseña de NATS_ENGINE_PASSWORD (variable de
# entorno del contenedor, definida en deploy/.env; no se versiona). Solo puede publicar en el
# historial del catálogo y usar la API de JetStream de su propio stream.
#
# El prefijo "sched" y el stream "SCHED_CATALOG" son los valores por defecto del motor
# (SCHED_NATS_SUBJECT_PREFIX, SCHED_NATS_STREAM): si los cambia, cámbielos aquí también.
# No hay puerto de monitoreo (8222) ni acceso desde fuera de la red de Docker.

port: 4222
server_name: sched-nats

jetstream {
  store_dir: "/data"
}

tls {
  cert_file: "/certs/server.crt"
  key_file: "/certs/server.key"
  timeout: 2
}

authorization {
  users = [
    {
      user: "engine"
      # La contraseña empieza con una letra para que NATS no la interprete como número.
      password: $NATS_ENGINE_PASSWORD
      permissions: {
        publish: {
          allow: [
            # Escribir el historial (solo la instancia de ingesta lo hace).
            "sched.catalog.>"
            # Crear y consultar el stream, y leerlo con un consumidor ordenado.
            "$JS.API.STREAM.CREATE.SCHED_CATALOG"
            "$JS.API.STREAM.INFO.SCHED_CATALOG"
            "$JS.API.STREAM.PURGE.SCHED_CATALOG"
            "$JS.API.CONSUMER.CREATE.SCHED_CATALOG"
            "$JS.API.CONSUMER.CREATE.SCHED_CATALOG.>"
            "$JS.API.CONSUMER.DURABLE.CREATE.SCHED_CATALOG.>"
            "$JS.API.CONSUMER.INFO.SCHED_CATALOG.>"
            "$JS.API.CONSUMER.DELETE.SCHED_CATALOG.>"
            "$JS.API.CONSUMER.MSG.NEXT.SCHED_CATALOG.>"
            "$JS.ACK.SCHED_CATALOG.>"
            "$JS.FC.SCHED_CATALOG.>"
          ]
        }
        subscribe: {
          # Respuestas a sus propias solicitudes y entrega del consumidor.
          allow: ["_INBOX.>"]
        }
      }
    }
  ]
}
